<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 128" width="140" height="128" role="img" aria-labelledby="t">
  <title id="t">Symbolon: a token broken in two halves that fit together</title>
  <defs>
    <!-- The break line, shared by both halves so they match exactly -->
    <clipPath id="left">
      <path d="M64 12 A52 52 0 0 0 64 116 L62 106 L69 96 L58 82 L71 68 L57 54 L70 40 L58 26 Z"/>
    </clipPath>
    <clipPath id="right">
      <path d="M64 12 A52 52 0 0 1 64 116 L62 106 L69 96 L58 82 L71 68 L57 54 L70 40 L58 26 Z"/>
    </clipPath>
    <g id="token">
      <circle cx="64" cy="64" r="52"/>
      <circle cx="64" cy="64" r="41" fill="none" stroke="#7a3f17" stroke-width="3"/>
      <circle cx="64" cy="64" r="12" fill="none" stroke="#7a3f17" stroke-width="3"/>
      <circle cx="64" cy="33" r="3.5" fill="#7a3f17"/>
      <circle cx="64" cy="95" r="3.5" fill="#7a3f17"/>
      <circle cx="33" cy="64" r="3.5" fill="#7a3f17"/>
      <circle cx="95" cy="64" r="3.5" fill="#7a3f17"/>
    </g>
  </defs>

  <!-- Left half -->
  <g transform="translate(1 0) rotate(-7 64 64)">
    <g clip-path="url(#left)" fill="#c9763a"><use href="#token"/></g>
    <path d="M64 12 A52 52 0 0 0 64 116 L62 106 L69 96 L58 82 L71 68 L57 54 L70 40 L58 26 Z"
          fill="none" stroke="#5e3012" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- Right half -->
  <g transform="translate(11 0) rotate(7 64 64)">
    <g clip-path="url(#right)" fill="#dc8f52"><use href="#token"/></g>
    <path d="M64 12 A52 52 0 0 1 64 116 L62 106 L69 96 L58 82 L71 68 L57 54 L70 40 L58 26 Z"
          fill="none" stroke="#5e3012" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
</svg>
